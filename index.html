<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something For You</title>
  <link rel="stylesheet" href="css.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap">
</head>
<body>

  <!-- Floating Spotify Widget -->
  <div class="spotify-control">
    <iframe 
      style="border-radius:12px" 
      src="https://open.spotify.com/embed/track/YOUR_TRACK_ID_HERE?utm_source=generator&theme=0" 
      width="100%" 
      height="80" 
      frameBorder="0" 
      allowfullscreen="" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>
  </div>

  <!-- Screen 1: Interactive Question -->
  <section id="question-screen">
    <div class="card">
      <h1 id="question-title">Do you love me? ❤️</h1>
      <div class="button-group">
        <button id="yes-btn" onclick="handleYes()">Yes ❤️</button>
        <button id="no-btn" onclick="handleNo()">No 💔</button>
      </div>
      <div id="response-area"></div>
    </div>
  </section>

  <!-- Screen 2: Gallery & Envelope Letter -->
  <main id="main-content" class="hidden">
    
    <header class="gallery-header">
      <h2 class="overlay-text">I love you so much, baby</h2>
    </header>

    <!-- Polaroid Gallery Section -->
    <section class="polaroid-gallery">
      <div class="polaroid rotate-left" onclick="openLightbox(this)">
        <img src="Screenshot_20260822_003804_Files by Google.jpg" alt="Memory 1">
      </div>
      <div class="polaroid rotate-right" onclick="openLightbox(this)">
        <img src="Screenshot_20260822_003831_Files by Google.jpg" alt="Memory 2">
      </div>
      <div class="polaroid rotate-slight-left" onclick="openLightbox(this)">
        <img src="Screenshot_20260822_003845_Files by Google.jpg" alt="Memory 3">
      </div>
      <div class="polaroid rotate-slight-right" onclick="openLightbox(this)">
        <img src="Screenshot_20260822_003900_Files by Google.jpg" alt="Memory 4">
      </div>
      <div class="polaroid rotate-left" onclick="openLightbox(this)">
        <img src="Screenshot_20260822_003913_Files by Google.jpg" alt="Memory 5">
      </div>
      <div class="polaroid rotate-right" onclick="openLightbox(this)">
        <img src="Screenshot_20260822_003947_Files by Google.jpg" alt="Memory 6">
      </div>
    </section>

    <!-- Interactive Envelope & Letter Section -->
 <section class="letter-container">
  <div class="envelope-wrapper" onclick="openEnvelope()" style="position: relative; z-index: 999; cursor: pointer;">
    <div class="envelope" onclick="openEnvelope()">
      <div class="wax-seal">❤️</div>
      <p class="click-notice">Tap to open letter</p>
    </div>
  </div>

  <div class="parchment hidden-letter" id="letter-content" style="display: none;">
    <h3 class="letter-heading">Hey Varshita Darling,</h3>
    <p class="letter-body" id="typed-text"></p>
    <p class="letter-signature">ALWAYS & FOREVER</p>
  </div>
</section>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
  </div>

  <!-- Floating Hearts Canvas -->
  <canvas id="heartCanvas"></canvas>

  <script src="java.js"></script>
</body>
</html>
